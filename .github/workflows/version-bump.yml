# Guaranteed semver bump: every push to main auto-increments ORK_NPU_VERSION in include/ork_npu.h so
# every build is uniquely identifiable (ork_npu_version() returns it; the ggml-ork backend prints it).
# Bump level from the pushed commit message: "#major" / "#minor", else PATCH. The bump commit is pushed
# with the default GITHUB_TOKEN (which by design does NOT re-trigger workflows) AND carries "[skip ci]",
# so it can never loop. A matching git tag vX.Y.Z is created as the authoritative version anchor.
name: version-bump

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual trigger (fallback / on-demand bump)

# never run twice for the same ref at once (avoids racing bumps)
concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # belt-and-suspenders: skip the bot's own bump commit (GITHUB_TOKEN already prevents re-trigger)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true          # need existing vX.Y.Z tags to pick a non-colliding next version
          token: ${{ secrets.GITHUB_TOKEN }}

      # Gate the bump on board-validation: do NOT bump/tag a commit whose NPU-output sources changed
      # since the last passing board `make test` (attestation must precede the version bump). No NPU
      # needed here — check-attest is just sha256 + grep. A stale attest fails the job before any bump.
      - name: Verify board-validation attestation (gate the bump)
        run: make check-attest

      - name: Bump ORK_NPU_VERSION
        run: |
          set -euo pipefail
          git fetch --tags --force origin   # belt-and-suspenders: ensure all tags are local
          HDR=include/ork_npu.h
          HVER=$(grep -E '#define[[:space:]]+ORK_NPU_VERSION' "$HDR" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$HVER" ] || { echo "could not parse ORK_NPU_VERSION from $HDR"; exit 1; }

          # Base the bump on max(header, latest tag), not the header alone: a prior run may have pushed
          # a vX.Y.Z tag while its [skip ci] header commit failed to land (non-ff race), leaving the tag
          # AHEAD of the header. Incrementing the header alone then re-collides with that tag forever
          # (fatal: tag already exists -> exit 128). Anchoring on the tags guarantees a fresh version.
          TVER=$(git tag -l 'v*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          CUR=$(printf '%s\n%s\n' "$HVER" "${TVER:-0.0.0}" | sort -V | tail -1)
          echo "header=$HVER latest-tag=${TVER:-none} -> base=$CUR"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CUR"

          MSG=$(git log -1 --pretty=%B)
          case "$MSG" in
            *'#major'*) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            *'#minor'*) MINOR=$((MINOR+1)); PATCH=0 ;;
            *)          PATCH=$((PATCH+1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          # paranoia: if NEW somehow still exists as a tag, keep incrementing PATCH until it's free
          while git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; do
            PATCH=$((PATCH+1)); NEW="$MAJOR.$MINOR.$PATCH"
          done
          echo "ORK_NPU_VERSION: $HVER -> $NEW"

          sed -i -E "s/(#define[[:space:]]+ORK_NPU_VERSION[[:space:]]+\")[0-9]+\.[0-9]+\.[0-9]+/\1$NEW/" "$HDR"
          grep -E '#define[[:space:]]+ORK_NPU_VERSION' "$HDR"

          if git diff --quiet -- "$HDR"; then echo "no version change; nothing to do"; exit 0; fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$HDR"
          git commit -m "chore: bump ORK_NPU_VERSION to $NEW [skip ci]"
          git tag "v$NEW"
          git push origin HEAD:main
          git push origin "v$NEW"
