# COMPILE THE CODE. Until now CI ran only `make check-attest` — sha256 + grep — so nothing verified the
# tree even builds; a commit that did not compile could reach main and only fail on the board.
#
# It was believed this could not run in CI because the sources are Linux-only (sys/prctl.h,
# pthread_barrier_t). That is not the blocker: both are fine on Linux/x86. The real blocker is 30 unguarded
# arm_neon.h includes and ~39 NEON intrinsics, which no x86 compiler will accept. So the fix is not to make
# the tree portable — it is to compile it where it belongs. GitHub's arm64 Linux runners are free for public
# repos and satisfy prctl, pthread_barrier AND NEON, so the FULL tree builds with no source changes.
#
# Still no NPU here, so nothing is run — `make test` remains the board's job, gated by check-attest.
name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: gates that need no NPU
        run: |
          make check-registry
          make check-install

      - name: compile
        # shell: bash is LOAD-BEARING, not style. Without it GitHub runs `run:` as `bash -e {0}` -- -e but
        # NOT pipefail -- so `make | tee` reports tee's status and a build that FAILS TO COMPILE exits 0.
        # `shell: bash` is documented to use `bash --noprofile --norc -eo pipefail`. Verified: under
        # `bash -e`, `false | tee` gives rc=0; under `bash -eo pipefail` it gives rc=1.
        #
        # The first version of this workflow omitted it, which neutered BOTH gates with one pipe: the
        # compile step could not fail, and the ratchet then counted warnings from a TRUNCATED log -- fewer
        # warnings, so it passed too. Exactly the silently-discarded-status class this repo has been
        # fixing elsewhere.
        shell: bash
        run: make -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: warning ratchet
        shell: bash
        # PER-SIGNATURE, not a scalar total. A single number lets a drop in one warning fund an increase in
        # another ("fixed 10 indentation, added 10 unused-variable" nets zero), and it makes re-baselining
        # after a compiler change a silent-absorption channel: if the count drifts down to 140 and someone
        # then adds 12 warnings, a 152 baseline still waves it through. Comparing per flag closes both.
        #
        # The compiler is NOT pinned (ubuntu-24.04-arm pins the OS image, not gcc), so an image upgrade can
        # legitimately move these. When that happens the failure output contains the exact file to commit --
        # re-baseline deliberately, and the diff shows which signatures moved rather than hiding it in a
        # total.
        run: |
          grep -oE '\[-W[a-z-]+\]' /tmp/build.log | sort | uniq -c | awk '{print $1, $2}' > /tmp/sig.txt
          u=$(grep -c 'warning:' /tmp/build.log || true)
          t=$(grep -cE 'warning:.*\[-W' /tmp/build.log || true)
          echo "$((u - t)) [untagged]" >> /tmp/sig.txt
          sort -k2 /tmp/sig.txt > /tmp/now.txt
          sort -k2 tools/warning_baseline.txt | grep -vE '^\s*#|^\s*$' > /tmp/base.txt || true
          echo "--- current ---"; cat /tmp/now.txt
          fail=0
          while read -r n sig; do
            b=$(awk -v s="$sig" '$2==s {print $1}' /tmp/base.txt); b=${b:-0}
            if [ "$n" -gt "$b" ]; then echo "::error::$sig went $b -> $n"; fail=1; fi
          done < /tmp/now.txt
          while read -r n sig; do
            c=$(awk -v s="$sig" '$2==s {print $1}' /tmp/now.txt); c=${c:-0}
            [ "$c" -lt "$n" ] && echo "::notice::$sig improved $n -> $c (commit the block below to hold it)"
          done < /tmp/base.txt
          if [ "$fail" = 1 ]; then
            echo "commit this as tools/warning_baseline.txt only if the increase is intended:"; cat /tmp/now.txt
            grep -E 'warning:' /tmp/build.log | tail -20
            exit 1
          fi
          echo "warning ratchet OK (per-signature)"
